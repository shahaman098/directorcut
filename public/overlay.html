<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DirectorCut · Broadcast overlay</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent !important; }
    [hidden] { display: none !important; }
    #scene { position: fixed; inset: 0; color: #fff7e8; pointer-events: none; --accent: #e8bf75; --muted: #e0d5c3; }
    .layer, .bar, .flash, .speedlines { position: absolute; inset: 0; }
    .layer { opacity: 0; transition: opacity .5s ease; will-change: opacity; }
    .vignette { background: radial-gradient(ellipse at 50% 40%, transparent 20%, #08080c55 62%, #000e 100%); }
    .tint { background: #3d32204d; }
    .light { background: radial-gradient(ellipse at 110% 15%, #ffd77c55, transparent 60%); }
    #grain { width: 100%; height: 100%; opacity: 0; }
    .bar { height: 12vh; background: #08090b; z-index: 6; transition: transform .3s cubic-bezier(.2,.8,.2,1); will-change: transform; }
    .bar.top { bottom: auto; transform: translateY(-101%); border-bottom: 1px solid #ffffff1a; }
    .bar.bottom { top: auto; transform: translateY(101%); border-top: 1px solid #ffffff1a; }
    .bar-content { height: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 4vw; font-size: clamp(9px,.72vw,15px); letter-spacing: .26em; }
    .wordmark { display: flex; align-items: center; gap: .8em; font: 700 clamp(9px,.78vw,16px) system-ui, sans-serif; letter-spacing: .24em; color: #f2efe9; }
    .wordmark svg { width: 1.5em; height: 1.5em; color: var(--accent); }
    .top-right { display: flex; align-items: center; gap: 1.6vw; }
    #timecode { color: #8f8d89; font-variant-numeric: tabular-nums; letter-spacing: .14em; }
    #timecode::before { content: 'TC'; color: var(--accent); margin-right: .9em; }
    .progress { position: absolute; left: 0; right: 0; top: -1px; height: 2px; background: var(--accent); transform-origin: left center; transform: scaleX(0); opacity: .85; }
    .speedlines, .scoreboard, .flash, #sub-caption { will-change: transform, opacity; }
    .flash { z-index: 9; background: #fff; opacity: 0; }
    .badge-row { position: absolute; z-index: 4; top: 16.5vh; left: 5vw; display: flex; gap: 1.1vw; align-items: center; opacity: 0; transform: translateY(-12px); transition: opacity .4s .4s, transform .4s .4s; will-change: opacity, transform; }
    .badge { display: flex; align-items: center; gap: .65em; padding: .65em .9em; background: #f8f4eb; color: #101114; font: 900 clamp(12px,1.1vw,23px) 'Arial Black', Impact, sans-serif; letter-spacing: .08em; box-shadow: 5px 5px 0 #0005; }
    .red-dot { width: .5em; height: .5em; border-radius: 50%; background: #e53b3b; animation: blink 1s step-end infinite; }
    .style-label { font-size: clamp(9px,.8vw,16px); letter-spacing: .2em; font-weight: 700; text-shadow: 0 2px 8px #000; }
    .caption-block { z-index: 4; position: absolute; bottom: 21vh; left: 7vw; width: 86vw; text-align: center; opacity: 0; transform: translateY(18px); transition: opacity .4s .6s, transform .55s .6s; will-change: transform, opacity; }
    h1 { font: 400 clamp(28px,7vw,136px)/1.02 Georgia, 'Times New Roman', serif; letter-spacing: -.045em; text-shadow: 0 4px 3px #0009, 0 8px 50px #000d; margin: 0; overflow-wrap: anywhere; text-wrap: balance; }
    h1.long { font-size: clamp(24px,5.2vw,100px); }
    .sportscast h1.long { font-size: clamp(22px,4.3vw,84px); }
    #caption .w { display: inline-block; opacity: 0; transform: translateY(.18em); transition: opacity .5s ease, transform .7s cubic-bezier(.2,.8,.2,1); }
    #caption.in .w { opacity: 1; transform: none; }
    #sub-caption { color: var(--muted); font: 500 clamp(12px,1.9vw,37px)/1.4 system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; margin: 2.8vh 0 0; opacity: 0; transition: opacity .7s 1.8s; text-shadow: 0 2px 12px #000; }
    .credit, .take { display: flex; flex-direction: column; gap: .35em; font-family: system-ui, sans-serif; }
    .credit small, .take small { font-size: clamp(7px,.58vw,12px); font-weight: 600; letter-spacing: .3em; color: #8e8c88; }
    .credit b { font: 600 clamp(11px,1.15vw,24px)/1 system-ui, sans-serif; letter-spacing: .04em; color: var(--accent); }
    .take b { font: 500 clamp(10px,.9vw,19px)/1 ui-monospace, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: .08em; color: #e8e4dc; }
    .credit { text-align: right; align-items: flex-end; opacity: 0; transform: translateY(12px); transition: opacity .6s 1.2s, transform .6s 1.2s; will-change: opacity, transform; }
    .speedlines { opacity: 0; width: 150%; height: 150%; left: -25%; top: -25%; transform-origin: center; }
    .scoreboard { display: none; position: absolute; right: 5vw; top: 16.5vh; z-index: 4; background: #071b3b; border-top: 3px solid #46c9ff; padding: .7em 1.2em; font: 900 clamp(10px,1vw,22px) 'Arial Black', Impact, sans-serif; letter-spacing: .08em; }
    .scoreboard small { display: block; color: #78d8ff; font: 600 .55em system-ui; letter-spacing: .18em; margin-top: .5em; }
    #audio-unlock, #debug { position: absolute; z-index: 12; font: 11px system-ui; background: #111d; border: 1px solid #ffffff35; border-radius: 3px; color: #eee; padding: 7px 10px; }
    #audio-unlock { bottom: 13.5vh; left: 4vw; pointer-events: auto; cursor: pointer; transition: opacity .3s; font-size: 13px; padding: 9px 14px; background: #0d0e10ee; border-color: #e8bf7580; }
    #audio-unlock.fading { opacity: 0; }
    #audio-unlock:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    #debug { right: 4vw; bottom: 13.5vh; color: #bfffc5; }
    #scene.active .bar { transform: translateY(0); }
    #scene.active .vignette { opacity: 1; }
    #scene.active #grain { opacity: .07; }
    #scene.styled .tint, #scene.styled .light { opacity: 1; }
    #scene.active .badge-row, #scene.active .caption-block, #scene.active .credit { opacity: 1; transform: translateY(0); }
    #scene.active #sub-caption { opacity: 1; }
    #scene.active .flash { animation: flash .08s linear both; }
    #scene.noir { --accent: #ddd8c6; --muted: #c5c7c8; }
    .noir .tint { background: #7b849638; }
    .noir .light { background: linear-gradient(125deg, #00000099 10%, transparent 45%, #e5edff30 48%, transparent 55%, #00000080 90%); }
    .noir h1 { font-style: italic; }
    #scene.anime { --accent: #73fff7; --muted: #ffe1fa; }
    .anime .tint { background: linear-gradient(120deg, #79045680, #073f6866); }
    .anime .light { background: radial-gradient(ellipse at center, transparent 25%, #e624ba40 75%); }
    .anime h1 { font-family: 'Arial Black', Impact, sans-serif; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -.065em; text-shadow: 4px 4px 0 #b62b95, -3px -2px 0 #165b75, 0 10px 35px #000; }
    #scene.anime.styled .speedlines { opacity: .48; animation: rotate-lines 24s linear infinite; }
    .anime .badge { background: #73fff7; box-shadow: 5px 5px 0 #da319d; transform: skewX(-8deg); }
    .hollywood .tint { background: #b88a5e38; }
    .hollywood h1 { color: #fff3d5; }
    #scene.baywatch { --accent: #ffc18c; --muted: #fff0d5; }
    .baywatch .tint { background: linear-gradient(#d8808166, #ff8c3280); }
    .baywatch .light { background: radial-gradient(ellipse at 90% 20%, #ffdb8dcc, transparent 65%); }
    .baywatch .vignette { background: radial-gradient(ellipse at center, transparent 20%, #81351b44 65%, #251017c9 100%); }
    .baywatch h1 { font-style: italic; text-shadow: 0 4px 18px #5c1b12, 0 0 60px #ffc78180; }
    #scene.sportscast { --accent: #62d4ff; --muted: #d0edff; }
    .sportscast .tint { background: linear-gradient(transparent 30%, #063991cc 88%); }
    .sportscast .light { background: linear-gradient(120deg, transparent 50%, #118dff33); }
    .sportscast .caption-block { text-align: left; left: 5vw; width: 90vw; padding: 2.5vh 2vw; border-left: .45vw solid #62d4ff; background: linear-gradient(90deg, #061b3be8, #07467bcc, #07467b00); }
    .sportscast h1 { font: 900 clamp(26px,5.6vw,108px)/1.02 'Arial Black', Impact, sans-serif; text-transform: uppercase; letter-spacing: -.045em; }
    .sportscast #sub-caption { font-size: clamp(11px,1.5vw,30px); }
    #scene.sportscast.active .scoreboard { display: block; animation: chip-in .4s .4s both; }
    #scene.exiting .layer, #scene.exiting .speedlines, #scene.exiting .scoreboard { opacity: 0; transition: opacity .65s; }
    #scene.exiting .scoreboard { animation: none; }
    #scene.exiting #grain, #scene.anime.styled.exiting .speedlines { opacity: 0; animation: none; transition: opacity .65s; }
    #scene.exiting .badge-row, #scene.exiting .caption-block, #scene.exiting .credit { opacity: 0; transform: translateY(15px); transition: opacity .3s, transform .4s; }
    #scene.exiting .bar.top { transform: translateY(-101%); transition-duration: .6s; }
    #scene.exiting .bar.bottom { transform: translateY(101%); transition-duration: .6s; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes flash { from { opacity: .85; } to { opacity: 0; } }
    @keyframes rotate-lines { from { transform: rotate(0deg); } to { transform: rotate(24deg); } }
    @keyframes chip-in { from { opacity: 0; transform: translateX(15px); } to { opacity: 1; transform: translateX(0); } }
    @media (max-width: 600px) { #timecode { display: none; } .badge-row { gap: 3vw; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; } .flash { display: none; } }
  </style>
</head>
<body>
  <main id="scene" hidden aria-label="Cinematic replay">
    <div class="layer tint"></div><div class="layer light"></div><div class="layer vignette"></div>
    <svg class="speedlines" viewBox="0 0 1000 1000" aria-hidden="true">
      <defs><linearGradient id="speed"><stop stop-color="#ff39bc"/><stop offset="1" stop-color="#68fff9"/></linearGradient></defs>
      <g fill="url(#speed)" opacity=".8">
        <path d="M0 0 375 400 40 0ZM180 0 430 365 225 0ZM500 0 495 350 540 0ZM770 0 580 380 830 0ZM1000 0 650 420 1000 70ZM1000 250 670 460 1000 300ZM1000 490 700 505 1000 530ZM1000 800 650 570 1000 860ZM1000 1000 610 640 930 1000ZM710 1000 550 675 660 1000ZM450 1000 480 680 400 1000ZM100 1000 410 640 20 1000ZM0 800 355 570 0 740ZM0 550 320 505 0 500ZM0 300 350 450 0 240Z"/>
      </g>
    </svg>
    <canvas id="grain" class="layer" width="480" height="270" aria-hidden="true"></canvas>
    <div class="bar top"><div class="bar-content"><span class="wordmark"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="1.5" y="1.5" width="13" height="3.5" fill="currentColor"/><rect x="1.5" y="11" width="13" height="3.5" fill="currentColor"/></svg>DIRECTORCUT</span><span class="top-right"><span id="channel">LIVE CINEMA</span><span id="timecode" aria-hidden="true">00:00:00:00</span></span></div></div>
    <div class="badge-row"><span class="badge"><i class="red-dot" aria-hidden="true"></i><span id="badge">REPLAY</span></span><span class="style-label" id="style-label">NOIR / DIR. AI</span></div>
    <div class="scoreboard">CHAT <span aria-hidden="true">//</span> <span id="score-take">01</span><small>INSTANT CLASSIC · LIVE</small></div>
    <section class="caption-block"><h1 id="caption"></h1><p id="sub-caption"></p></section>
    <div class="bar bottom"><i class="progress" id="progress" aria-hidden="true"></i><div class="bar-content"><span class="take"><small>TAKE</small><b id="take">001</b></span><span class="credit"><small id="credit-role">EXECUTIVE PRODUCER</small><b id="credit-name"></b></span></div></div>
    <div class="flash" aria-hidden="true"></div>
    <button id="audio-unlock" type="button" hidden>🔊 Click to enable sound</button>
    <output id="debug" hidden></output>
  </main>
  <script>
    // Rehearsal backdrop: ?backdrop=1 paints a stand-in "gameplay" layer so the
    // overlay can be previewed in a plain browser (OBS composites over real gameplay).
    // ?preview=1 (used by the operator console) mutes the sting.
    // ?backdrop=checker paints the standard transparency checkerboard (used by the console's program monitor).
    const backdrop = new URLSearchParams(location.search).get('backdrop');
    if (backdrop !== null) {
      const paint = backdrop === 'checker'
        ? 'background:#141416 repeating-conic-gradient(#202024 0 25%,#141416 0 50%) 0 0/48px 48px'
        : 'background:linear-gradient(135deg,#123a6b,#7a1f4c,#c96f1f) center/cover';
      document.write(`<style>body::after{content:'';position:fixed;inset:0;z-index:-1;${paint}}</style>`);
    }
  </script>
  <script src="/overlay.js" defer></script>
</body>
</html>
